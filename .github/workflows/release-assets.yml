name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive assets
        required: true
        default: v0.1.0
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            archive: raw
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            archive: raw
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            deb_arch: amd64
            archive: raw
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            deb_arch: arm64
            archive: cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.archive == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build binary
        shell: bash
        run: |
          if [[ "${{ matrix.archive }}" == "cross" ]]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi
      - name: Stage binary and Debian package
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist/pkg/usr/bin dist/pkg/DEBIAN
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/agentman.exe" "dist/agentman-v${version}-${{ matrix.platform }}-${{ matrix.arch }}.exe"
          else
            cp "target/${{ matrix.target }}/release/agentman" "dist/agentman-v${version}-${{ matrix.platform }}-${{ matrix.arch }}"
            if [[ "${{ matrix.platform }}" == "linux" ]]; then
              cp "target/${{ matrix.target }}/release/agentman" dist/pkg/usr/bin/agentman
              printf 'Package: agentman\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: %s\nMaintainer: Musichen <musichen@users.noreply.github.com>\nDescription: Local coding-agent session manager\n' "$version" "${{ matrix.deb_arch }}" > dist/pkg/DEBIAN/control
              dpkg-deb --build dist/pkg "dist/agentman-v${version}-linux-${{ matrix.arch }}.deb"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agentman-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: agentman-*
          merge-multiple: true
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "agentman $RELEASE_TAG" --generate-notes
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/agentman-* --clobber --repo "$GITHUB_REPOSITORY"

  npm-publish:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish npm wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./npm/package.json').version")
          if npm view "agentman@$version" version >/dev/null 2>&1; then
            echo "agentman@$version already on npm, skipping"
          else
            npm publish ./npm --access public
          fi
